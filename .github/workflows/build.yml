name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack Project
        run: |
          if [ -f studyflow.zip ]; then
            unzip -o studyflow.zip
          fi
          if [ ! -f "gradlew" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
            if [ -n "$SUBDIR" ]; then
              cp -rn "$SUBDIR"/* . || true
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Execute Permission
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\""
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/**/*.apk"
          
