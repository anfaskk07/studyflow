name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unzip and Generate Wrapper
        run: |
          if [ -f studyflow.zip ]; then
            unzip -o studyflow.zip
          fi
          
          # If gradlew does not exist, generate it using installed Gradle
          if [ ! -f "gradlew" ]; then
            echo "Generating gradlew wrapper..."
            gradle wrapper --gradle-version 9.3.1 || gradle wrapper
          fi
          
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=\"-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8\""
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/**/*.apk"
          
